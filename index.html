<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PostHog Flashcards</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1d1d1b;--mute:#6b6a65;--line:#e3e1da;--acc:#f54e00;--ok:#1f8a4c;--bad:#c2410c;--chip:#ecebe5;--beat:#fbfaf6;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141413;--card:#1f1f1d;--ink:#eeede8;--mute:#9a998f;--line:#33332f;--acc:#ff7a3d;--ok:#4cc27e;--bad:#f08a52;--chip:#2a2a27;--beat:#262624;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141413;--card:#1f1f1d;--ink:#eeede8;--mute:#9a998f;--line:#33332f;--acc:#ff7a3d;--ok:#4cc27e;--bad:#f08a52;--chip:#2a2a27;--beat:#262624;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 80px}
h1{font-size:20px;margin:4px 0 2px}
.sub{color:var(--mute);font-size:14px;margin:0 0 12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;padding:5px 11px;font-size:13px;cursor:pointer}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0 12px;font-size:14px;color:var(--mute)}
.bar button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer}
.prog{height:6px;background:var(--chip);border-radius:4px;overflow:hidden;margin-bottom:12px}
.prog i{display:block;height:100%;background:var(--ok);width:0;transition:width .2s}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;min-height:260px;cursor:pointer;user-select:none}
.cat{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--acc);font-weight:600}
.q{font-size:21px;font-weight:650;margin:8px 0 6px;line-height:1.35}
.hint{color:var(--mute);font-size:13px;margin-top:18px}
.ans{display:none;margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.card.open .ans{display:block}.card.open .hint{display:none}
.ans ol{margin:0;padding-left:22px}.ans li{margin:5px 0;background:var(--beat);border-radius:6px;padding:3px 6px}
.ref{margin-top:10px;font-size:14px;color:var(--mute)}.ref b{color:var(--ink)}
.bridge{margin-top:10px;font-size:14px;border-left:3px solid var(--acc);padding:4px 10px;font-style:italic}
.acts{display:flex;gap:10px;margin-top:14px}
.acts button{flex:1;border:0;border-radius:10px;padding:13px;font-size:16px;font-weight:600;cursor:pointer;color:#fff}
.again{background:var(--bad)}.got{background:var(--ok)}
.nav{display:flex;justify-content:space-between;margin-top:10px}
.nav button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:8px 14px;cursor:pointer}
.done{text-align:center;padding:40px 10px;color:var(--mute)}
.list .item{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0}
.list .item .q{font-size:16px;margin:4px 0}
.k{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;margin-left:6px;vertical-align:middle}
.k.y{background:var(--ok);color:#fff}.k.n{background:var(--bad);color:#fff}
</style>
</head>

<div class="wrap">
<h1>PostHog · Dana flashcards</h1>
<p class="sub">Mon 19/10 · 17:00 Lisbon · tap the card to reveal the beats · say it out loud first, then check</p>
<div class="chips" id="chips"></div>
<div class="bar">
  <span id="count"></span>
  <button id="shuffle">🔀 Shuffle</button>
  <button id="onlyAgain">Only "again"</button>
  <button id="mode">📋 List view</button>
  <button id="reset">Reset progress</button>
</div>
<div class="prog"><i id="pbar"></i></div>
<div id="view"></div>
</div>
<script>
const C=[
// ---------- Intro ----------
{c:"Intro",q:"Tell me about yourself (about 2 minutes).",a:["I'm the engineer our enterprise customers talk to. For almost 4 years I've been at Surfly, a co-browsing and video product, where I own the technical side of our biggest channel partnership, with NICE.","When I joined, every NICE customer was a custom project built on an old XML interface. So I built the integration layer between the 2 products, a TypeScript service that today serves 150+ business units, and I became the first line for every technical problem: SSO, APIs, networks, proxies, logs.","I also built the onboarding function. Go-live went from 16 weeks to a 6-week standard plan, 2 weeks at the fastest, and it carried us from 10 to 200+ customers with nobody added to the team. I run accounts like Chubb and Experian, and in 2025 we were NICE's Partner of the Year.","The part I'm proudest of is the early-warning side: a weekly job that flags at-risk accounts in Slack, an automatic check-in when usage drops, and an alert when a customer goes over their licences, so billing never comes as a surprise.","Before Surfly, I started in Industrial Engineering and 5 years of procurement at Maersk, then taught myself to code and became a software engineer, at Globo on their streaming platform and then owning the API at a startup. After that, 2 years as a product manager on an AI platform for offshore oil rigs at Shape Digital.","Outside work I run n8n self-hosted in production for a couple of small companies, and my own AI agents. And this week I set up PostHog on my own site, with a reverse proxy and cookieless mode, replacing a tracking stack I'd built myself.","That's why this role: it's retention on a product I already use, with customers who want someone technical in the room."],b:"Open with the first sentence, always. If they cut you short, beats 1, 3 and 7 are the core. Keep the past in 1 beat."},
{c:"Intro",q:"Why PostHog?",a:["I'm living your pitch: I built my own tracking stack (GA4, server-side tagging, my own server, Sheets + Supabase), and this week replaced most of it with PostHog on my own site.","The role is retention, which is what I've built at Surfly: early-warning flags, check-ins, the billing alert.","Your EU team is building skills and scouts for their books. That's the work I already do with my own agents.","The handbook: I read it and recognised how I already work."],r:"#19 build vs buy"},
{c:"Intro",q:"Why are you leaving Surfly?",a:["I built the function and it runs on its own.","All my customers come through one partner.","I want to own a book of accounts directly, on a product with broader scope, that I already use."],b:"Nothing negative. Nothing about the office announcement."},
{c:"Intro",q:"Pitch PostHog to me in 90 seconds.",a:["The problem: product teams stitch together 5 to 8 tools (analytics, replay, flags, experiments, errors). Data is siloed and bills stack up.","What it is: 1 platform, 1 data layer. Same events and people across every product, plus warehouse, SQL, and MCP for agents.","Why it matters: watch the replay of the users who dropped off the funnel, ship a fix behind a flag, measure it with an experiment, without leaving the tool.","Why teams pick it: generous free tier, transparent usage pricing, built for engineers.","Close with your proof: \"I replaced GA4, server-side tagging and a Sheets dashboard with it on my own site.\""]},
{c:"Intro",q:"Now the 30-second version.",a:["Product teams use 5 to 8 tools and the data never joins up.","PostHog puts analytics, replay, flags, experiments and errors on 1 data layer.","So you see the problem, ship the fix, and measure it in the same place, and it's free to start."]},
// ---------- PostHog knowledge ----------
{c:"PostHog",q:"How does PostHog prevent churn? (your 5 steps)",a:["Incentive: the CSM is paid to keep customers. NRR target 110%, quarterly.","Know why customers leave: churn reasons (8 we can influence, 3 we can't).","Fix the root cause early: foundation check, because customers install alone.","See the risk first: health tracking, engagement cliff, \"went silent\" → this week.","Risk mitigation: account plan, early signals, sticky products, Churn Risk tag → weekly review → call in 48 h → recovery plan → retro in 1 week."],b:"\"Your risk page describes almost exactly what I built at Surfly.\""},
{c:"PostHog",q:"What's in PostHog's health tracking?",a:["Product health score 0–10, daily: 61.5% engagement (usage vs its own history), 38.5% stickiness (pipelines, MCP, scouts…).","Relationship score 0–100: how recently we were in contact (Slack, tickets, meetings, email). Frequency, not sentiment.","CSM's own rating 1–5, honest; reset to 2 on handover.","Most actionable signal: the engagement cliff, a product dropping to zero.","\"Went silent\" → talk to them this week. \"Not used\" is cross-sell, not risk."],r:"#10 zero sessions = engagement cliff"},
{c:"PostHog",q:"Name 5 early warning signals from the risk page.",a:["Recommendation not actioned for 2+ weeks","Declining event volume, no seasonality","Only 1–2 active users","No Slack activity for 14+ days","Champion changed roles or left","(also: billing page visits, ticket spikes, single-product usage, data only exported to a warehouse)"],r:"#2 = the 2-week signal · #17 champion"},
{c:"PostHog",q:"What happens when you flag an account as a churn risk?",a:["Add the Churn Risk tag + a note: ARR, trigger, situation, help needed, plan. It posts to #customer-churn.","Weekly at-risk review: 60 seconds per account. 4+ weeks no improvement → escalate or accept and document.","Escalation brings help (engineering, product, lead), but you stay the owner.","Recovery call within 48 h, a plan with dates and owners shared with the customer.","If they churn: a retro within 1 week. Rule: when in doubt, flag it."],r:"#2 / #14: your Slack at-risk flags"},
{c:"PostHog",q:"The 7 questions of the quarterly account plan?",a:["Opportunities this quarter","Customer's business objectives","Measurable outcome by quarter end","Does the customer know the plan?","Blockers and risks","Salesforce opportunity","Key players: champion, budget holder, evaluators, users, and where you stand"],b:"\"My BRD covered most of it; I'd add the business objective and the full key-player map.\""},
{c:"PostHog",q:"The churn reasons PostHog can influence?",a:["Champion leaves","Contact is a coach, not a champion","Customer replaces PostHog (internal build, missing feature, better deal)","Poor customer experience","Can't extract value","Missing features or slow delivery","Lack of trust in the data","Privacy, compliance, data governance"],b:"Can't influence: acquisition, shutdown, poor ICP fit (document and share the learning)."},
{c:"PostHog",q:"CSM vs TAM on an overlay account: who does what?",a:["The TAM may have a commercial conversation in flight.","So anything that changes the customer's spend: flag it internally first.","The CSM owns the value case at renewal: what they used, what they got, where usage is heading.","Start renewal conversations 3 months out. Adding a TAM 30 days before is too late."]},
// ---------- Technical ----------
{c:"Technical",q:"Walk me through an end-to-end PostHog product workflow.",a:["Start with a measurable drop in a funnel or retention insight.","Open the session replays for the affected users and form a specific hypothesis.","Ship the proposed fix behind a feature flag to a controlled cohort.","Run an experiment with one primary metric and relevant guardrails.","Compare the result, roll out or revert, and document what changed."],b:"Funnel drop → replay → hypothesis → flag → experiment → measured decision."},
{c:"Technical",q:"Project token vs personal API key: what is the boundary?",a:["The project token identifies the PostHog project for public ingestion and client-side feature-flag evaluation. It is expected to appear in browser code.","A personal API key authenticates a user or service for management and data-access operations.","Never expose a personal API key in browser code, logs, screenshots or a public repository.","Use the narrowest scopes available and keep authenticated calls server-side."]},
{c:"Technical",q:"SSO, JIT and SCIM: explain the difference.",a:["SSO authenticates: it lets employees sign in through an identity provider such as Okta or Entra ID.","JIT provisioning creates the PostHog user when they authenticate for the first time.","SCIM manages the lifecycle: provision, update, assign and deactivate users centrally.","SAML alone does not reliably remove departed users; SCIM handles deprovisioning."],b:"Authentication is not lifecycle management."},
{c:"Technical",q:"How would you use surveys without annoying users?",a:["Start with one decision the answer will inform, not a generic feedback request.","Target the right cohort or feature-flag variant after meaningful behavior.","Use short questions and frequency limits; never interrupt the critical action itself.","Connect responses to the person, product events and session replay so qualitative feedback has behavioral context.","Close the loop by acting on the result and measuring whether behavior changes."]},
{c:"Technical",q:"What have you personally implemented in PostHog?",a:["Installed the web SDK on my own site and configured the correct EU host.","Put ingestion behind a reverse proxy and verified DNS, TLS and event delivery before switching api_host.","Configured consent behavior with cookieless mode on reject, plus masking for sensitive replay data.","Instrumented key business events rather than relying only on autocapture.","Used the setup to replace parts of a GA4, server-side tagging and custom dashboard stack."],b:"Only claim flags, experiments or error tracking after you have actually exercised them end to end."},
{c:"Technical",q:"How do you actually implement PostHog on a site? (their litmus test)",a:["SDK via npm or snippet; init with api_host = your proxy, ui_host = eu/us.posthog.com.","Pageviews on client-side navigation (history_change in SPAs).","identify() on login/sign-up with a stable ID, once; reset() on logout.","person_profiles: identified_only to control cost; groups for B2B (company).","Autocapture + custom events for key business moments + actions.","Replay with input masking; consent: cookieless on_reject.","\"That's exactly how I set up my own site this week.\""],r:"Your shipcoders.com audit"},
{c:"Technical",q:"What is a reverse proxy, and why does PostHog recommend one?",a:["A server in front of a service that receives requests on its behalf and forwards them.","Ad blockers block requests to known analytics domains.","Events go to the customer's own subdomain (CNAME to PostHog's managed proxy), so they get through.","Check: api_host points to the proxy, not to posthog.com (foundation check item)."],b:"\"DNS passed but TLS failed: the custom hostname didn't exist on their side. I recreated it, waited for the cert, then switched api_host. Switch first and you lose every event.\""},
{c:"Technical",q:"Users merging or splitting, funnels look wrong. What do you check?",a:["identify() called on every page instead of once per session","reset() called before identify(), or never on logout","Unstable or shared IDs (e.g. same ID for test users)","group() called on every page instead of when the group changes","Then fix it with the customer, not just flag it"]},
{c:"Technical",q:"A feature flag shows the wrong variant, or flickers on load.",a:["Release conditions: which properties, and are they available at evaluation time?","Flicker: flags load after first render → bootstrap flags, or server-side local evaluation.","Missing fallback code when flags fail to load.","Check the person/group the user actually resolves to."]},
{c:"Technical",q:"Customer says: \"session replays are empty or missing.\"",a:["Replay disabled, or sampling too low; minimum duration filtering short sessions","CSP blocking the recorder script or the ingestion host","Cross-origin iframes not captured","Ad blocker blocking the recorder → reverse proxy","No consent yet (consent-gated replay)"],b:"\"CSP and proxies are the class of problem I debugged at Chubb.\""},
{c:"Technical",q:"\"PostHog shows fewer users than GA / our database.\"",a:["Find which 2 numbers they're comparing, and the definitions.","Ad blockers without a proxy.","Consent: users who rejected (cookieless counts per day only).","identify merging users; bots filtered differently; time zones.","Fix it even if it's not a threat: a customer with another source of truth is at long-term risk."],r:"#18: NICE agents vs Surfly users"},
{c:"Technical",q:"Explain cookieless mode on_reject.",a:["Requires 'Cookieless server hash mode' in project settings.","Before a choice: nothing captured, nothing stored.","Accept → opt_in_capturing → normal tracking with cookies.","Reject → opt_out_capturing → still counted with a privacy-preserving hash computed on PostHog's servers, no cookies.","Don't identify or set email properties without consent."],b:"\"I implemented this on my site, mirroring my consent banner.\""},
{c:"Technical",q:"Customer's bill spiked. Where do you look?",a:["Act first: give concrete levers, gather context after.","Autocapture above 50% of events with no actions defined","Replay with no minimum duration (recommend 2+ seconds)","Group analytics add-on unused; person profiles 'always'","identify() on every page","Propose a target monthly spend, work back from it, pause expansion, tag 'cost optimizing'"],r:"#15 SAT"},
{c:"Technical",q:"Autocapture vs custom events?",a:["Autocapture: fast start, catches everything, but noisy and costs volume.","Custom events: the business moments that matter (signed up, booked, paid), with clean properties.","Actions: name autocaptured interactions without code.","My setup: autocapture on, custom events for lead and booking, replay masked."]},
{c:"Technical",q:"How would you audit a new account? (foundation check)",a:["Before the call: their replays and past conversations","Custom events, autocapture, properties, actions defined?","Reverse proxy (api_host)?","Persons, groups, cohorts set up intentionally? Over-identifying?","SDK version current? Sign up yourself and watch the events","Dashboards built for their goals? Pipelines/destinations in use?"],b:"Backend details: ask on the call."},
{c:"Technical",q:"A customer only exports data to their warehouse. Why does it matter?",a:["PostHog is a pipe, not a destination → easy to replace (an early warning signal).","Introduce sticky products: replay, flags and experiments in their release process, surveys, cohorts.","Frame it as adding capabilities, not replacing their warehouse.","Ask why they analyse everything in Looker or Mode."]},
{c:"Technical",q:"\"Events aren't showing up.\" How do you debug it?",a:["Activity / live events: is anything arriving at all?","Network tab: is the request sent, and what status comes back? Blocked by an ad blocker → proxy.","Right project key and right region: EU (eu.i.posthog.com) vs US (us.i.posthog.com). A mismatch drops everything.","Consent: opted out, or cookieless waiting for a choice (on_reject captures nothing until then).","Ingestion warnings in the project; timestamps in the future or past; init running before the SDK loads."],b:"\"Start with: is the request leaving the browser? Then: is it reaching the right project?\""},
{c:"Technical",q:"How would you design a tracking plan for a customer?",a:["Start from their questions: activation, conversion, retention. Not from 'track everything'.","Few key custom events, consistent naming: object + past-tense verb (form submitted, call booked).","Properties that answer the questions (plan, source, value), not high-cardinality noise.","Autocapture for the long tail, actions to name important clicks.","identify at sign-up/login, groups for the account, dashboards tied to their goals."],r:"Your site: lead submitted + call booked + replay masked"},
{c:"Technical",q:"Client-side vs server-side tracking: when each?",a:["Client-side (posthog-js): pageviews, clicks, replay, flags in the UI.","Server-side (posthog-node, Python…): payments, sign-ups confirmed, webhooks, anything an ad blocker must never drop.","Link them with the same distinct_id: pass posthog.get_distinct_id() from the browser to the backend, or identify by user ID on both sides.","Incoming webhooks for third parties (Stripe, Cal.com, Hotmart) → events."],r:"#19: your server did exactly this"},
{c:"Technical",q:"How does group analytics work, and why does it matter for B2B?",a:["Group types are categories like 'company' (up to 5 per project).","posthog.group('company', id, properties) attaches events to that account.","You see usage per company, not just per person: which accounts are active, adopting, at risk.","Flags and experiments can target a whole company.","It's an add-on: if unused, it's billing waste (risk page)."]},
{c:"Technical",q:"How do you run a good experiment in PostHog?",a:["One primary metric decided upfront (plus secondary/guardrail metrics).","Feature flag splits users; experiments sit on top of flags.","PostHog's default is Bayesian: it gives the probability a variant is better, not a p-value.","Enough data: at least 50 exposures and 5 conversions per variant before it shows results; plan the duration upfront.","Don't stop early just because one day looks good."]},
{c:"Technical",q:"Write a SQL query in PostHog: weekly active users per company.",a:["SQL runs on ClickHouse; tables like events and persons.","SELECT $group_0 AS company, count(DISTINCT person_id) AS wau","FROM events","WHERE timestamp > now() - INTERVAL 7 DAY","GROUP BY company ORDER BY wau DESC","($group_0 = the column of your first group type; properties.$current_url for event properties)"],b:"\"I write SQL weekly in BigQuery for account health; same thinking here.\""},
{c:"Technical",q:"Tracking across subdomains or another domain.",a:["Subdomains (www. and app.): PostHog's cookie is set on the root domain, so the same person carries across.","Different domains: no shared cookie → pass the distinct_id in the link, or identify on both sides.","Third-party pages (checkout, booking): use their webhook into PostHog, linked by email or ID after consent."],r:"Cal.com on your site"},
{c:"Technical",q:"EU vs US cloud, GDPR, data residency?",a:["PostHog Cloud has an EU region (data stays in the EU) and a US region.","GDPR tools: consent and opt-out, cookieless mode, masking, IP capture control, data deletion requests.","Customer decides region at project creation; moving later means a migration.","\"My site uses the EU cloud with cookieless on reject.\""]},
{c:"Technical",q:"How would you use PostHog's MCP or AI with a customer?",a:["MCP lets an agent query their PostHog data and act on it: insights, flags, errors.","For a CSM: an agent that reads my book every morning and flags usage drops, cost spikes, stuck recommendations.","Self-driving (beta): signals → scouts → an inbox of suggested improvements.","\"I already run an agent that briefs me every morning; your EU team builds scouts for their books.\""]},
{c:"Technical",q:"Error tracking shows minified, unreadable stack traces. Why?",a:["Production JavaScript is minified, so frames point to bundled code.","Upload source maps for each release (the wizard or CLI does it).","Match the release/version so the right maps are used.","Then errors link to real files and lines, and to the replay of that session."]},
{c:"Technical",q:"Web basics: CORS, CSP, 401 vs 403, and how you debug in the browser.",a:["Network tab: the request, its status, headers, and response body. Console for blocked-resource errors.","CORS: the browser blocks a cross-origin call because the server didn't allow that origin.","CSP: the page's own policy blocks a script or connection (e.g. the recorder or the ingestion host). Add the host to the policy.","401: not authenticated (missing or bad key). 403: authenticated but not allowed.","5xx: server side; 502/503/504 are retryable with backoff."],r:"#4 Chubb: CSP, cookies, iframes, Akamai"},
// ---------- Scenarios ----------
{c:"Scenario",q:"Usage on one account dropped sharply. What do you do?",a:["Check what changed, not just the health score: which product, which team went quiet.","Rule out seasonality and implementation (SDK upgrade, proxy, consent change).","Form a hypothesis, then reach out with something useful, not \"how's it going\".","If it's real risk: tag it, call within 48 h."],r:"#10 zero sessions · #16 credit union"},
{c:"Scenario",q:"You inherit an account. First 2 weeks?",a:["Homework before questions: usage, replays, tickets, past notes.","Look for cost optimisations, deeper value on what they use heavily, implementation issues.","Rate the relationship honestly (reset to 2).","Then a first call with a concrete first action item."],r:"Surfly: you replaced someone who'd left"},
{c:"Scenario",q:"A competitor appears 2 months before renewal.",a:["Late: renewal conversations should start 3 months out.","Diagnose why: price, product, relationship, implementation, business change.","Call, not email. Listen more than pitch. Be honest about gaps.","Build the value case: what they used, what they got, where usage is heading.","Multi-product: if they switch one need, keep them on the others."]},
{c:"Scenario",q:"Customer wants to cut cost; the TAM wants expansion.",a:["Efficiency wins: a customer paying for waste has a reason to leave.","Flag it internally first, because the TAM may have a conversation in flight.","Right-size, then expand from trust.","\"At Surfly I offered SAT the option that was cheaper for them.\""],r:"#15 SAT"},
{c:"Scenario",q:"The customer stopped replying.",a:["Find the cause in the data first (what stopped, when).","Reach out with a real finding, not a check-in.","Widen contacts: the AE or SE who closed it, other active users, their platform team.","Flag it internally early, with what you've tried."],r:"#17 CubeSmart"},
{c:"Scenario",q:"Customer asks for a feature PostHog doesn't have.",a:["Understand the real need and the workaround today.","If they're ICP: bring the PM and engineers in directly.","Flag the churn risk openly in the team channel.","Follow up proactively; update them when it's slow."],r:"#3 engineering \"not now\" · eHealth SOW"},
// ---------- Stories ----------
{c:"Story",q:"Case 1 — Tell me about your biggest success.",a:["Result first: onboarding from 16 weeks to a 6-week plan, 2 at the fastest, 200+ customers, nobody added.","SOPs, success plans, the onboarding kit I designed (BRD, kickoff deck, 6-week plan).","Templates and a demo library → mostly self-serve.","Monthly enablement for NICE's SEs and sales.","Salesforce → Asana → weekly n8n at-risk flags to Slack."],r:"#1",b:"\"Most churn starts at a bad implementation.\""},
{c:"Story",q:"Case 2 — Tell me about a failure.",a:["A blocker sat unnoticed for 2 weeks on an insurance implementation.","My mistake: relying on the customer to tell me things were stuck.","Apologised, same-day call, cleared it, new go-live (slipped 3–4 weeks).","Fixed the cause: weekly at-risk flags in Slack, later automatic check-ins.","Lesson: silence from a project isn't a sign it's healthy."],r:"#2",b:"\"That's the 2-week signal in your risk page.\""},
{c:"Story",q:"Case 3 — Engineering said ‘not now.’ How did you handle the disagreement?",a:["A major customer needed contact IDs correlated with session IDs and sent to its data lake.","Engineering was protecting a critical release; I accepted that constraint instead of escalating emotionally.","Found the same behavior in another endpoint, read the code, and documented the bounded change.","Built the business case and handed Engineering a cheap task to evaluate.","They reprioritized it; the customer could correlate contacts and sessions."],r:"#3",b:"A busy team helps faster when you do the thinking first."},
{c:"Story",q:"Case 4 — Tell me about a difficult enterprise customer.",a:["Chubb: CSP, firewall, cookies, sandboxed iframes; go-live blocked 2 weeks.","Mobilised their PM, SDEs, network and security; tracked it request by request.","Akamai kept flagging us as a proxy → IP-range rule with their team.","Narrowest possible ask, in their language.","2,500 licences at launch; became a reference account."],r:"#4"},
{c:"Story",q:"Case 5 — How did you turn an ambiguous idea into something shippable?",a:["NICE and Cognigy had an idea, but no spec or architecture, and 4 systems had to connect.","Fixed one outcome: an AI agent completes a real task on a live website and hands the same session to a human.","Tested the riskiest dependency first and proved it on HealthCare.gov.","Deferred the video avatar because it was not required to prove value.","Ready for NICE Interactions in 2 months; NICE created a new SKU sold to 2 customers."],r:"#5"},
{c:"Story",q:"Case 6 — Walk me through your most complex technical project.",a:["api-nice: replace an ad hoc XML integration before it was retired, zero re-platform.","TypeScript + Fastify, typed schemas; per-business-unit credentials in a database.","Auth chain: OpenID discovery → OAuth token → tenant from the JWT → that tenant's area and domain.","Session link passed when the contact starts; NICE returns the contact ID.","150+ business units, nobody re-platformed."],r:"#6",b:"No WebSocket. It isn't in the code."},
{c:"Story",q:"Case 7 — Tell me about influencing without authority.",a:["Surfly had a new FDE-focused ICP, but GTM lacked an actionable map.","Defined weighted intent signals from public job postings and LinkedIn activity.","Scored 497 postings and tiered 299 companies: 52 Tier A and 61 Tier B.","Mapped 269 FDEs, including 169 newly in role, plus hiring contacts.","GTM adopted the dashboard and outreach workflow; it booked 5 meetings in its first 2 weeks."],r:"#7"},
{c:"Story",q:"Case 8 — Tell me about learning something new quickly.",a:["Joined after the owner of Surfly's largest partnership left; nobody understood both products end to end.","Studied the partner's APIs, protocols and tools, built against them, and asked targeted questions.","Documented the platform while learning it.","Recognised every implementation was an ad hoc XML build and designed a shared REST layer.","That layer became api-nice, serving 150+ business units."],r:"#8"},
{c:"Story",q:"Case 9 — Tell me about an expansion you influenced.",a:["Chubb launched with a controlled rollout of 2,500 agent licences.","Made each rollout technically safe instead of pushing a commercial upsell.","Reused the completed security and network work for each new team.","Opened expansion opportunities; NICE owned the commercial close.","In 4 months, usage grew from 2,500 to 6,000+ licences and revenue more than doubled."],r:"#9"},
{c:"Story",q:"Case 10 — Tell me about catching an at-risk account early.",a:["A customer with 80 licences suddenly recorded zero sessions for 2 days; no ticket existed.","Usage monitoring triggered a check-in framed as support, not surveillance.","Asked what had changed before the call; they found a firewall change.","Confirmed recovery and used the call as an adoption check-in.","Sessions recovered in about 2 days, without a ticket or escalation."],r:"#10",b:"The earliest churn signal is often usage, not a complaint."},
{c:"Story",q:"Case 11 — How do you prioritise a full book of accounts?",a:["Signals decide, not who shouts: go-live risk, account value, usage drops, overage and blockers.","High-value or at-risk projects get live support.","Standard work runs on templates, self-serve docs and async updates.","Weekly risk reporting surfaces projects that silently deteriorate.","Kept 10–15 implementations moving while go-live dropped from 16 weeks to 6, and 2 at the fastest."],r:"#11"},
{c:"Story",q:"Case 12 — Explain a technical risk to a non-technical executive.",a:["A client report failed silently twice, WhatsApp falsely showed connected, and media storage was degrading infrastructure.","Translated it into customer risk, not containers or sockets.","Presented 2 choices: spend about 3 days on reliability or keep building features with silent-failure risk.","Moved alerts outside WhatsApp, fixed storage, added error handling and a real-send monitor.","The platform stabilized in about 3 days; the report has not failed silently since."],r:"#12"},
{c:"Story",q:"Case 13 — Tell me about a critical incident.",a:["Experian, go-live next morning, tool failing, no root cause.","Escalated the same day; ruled out retries with their engineers.","Searched logs by endpoint, not by key: a shared-IP rate limit hitting others too.","War room with DevOps and engineering; I kept the customer updated.","Fixed in 4 hours, live on schedule; proposed rate limiting by API key."],r:"#13",b:"\"Escalation brings help, but I stay the owner.\""},
{c:"Story",q:"Case 14 — How did you improve the Sales-to-implementation handoff?",a:["Deals closed in Salesforce, but commitments and expectations often stayed with Sales.","Treated the handoff as a product, not a meeting.","Closed-won now creates a templated Asana project with deal context.","Added a standard kickoff, success plan, weekly Slack risk signals and monthly AE/SE enablement.","Handoffs became consistent across 200+ customers and supported faster go-live."],r:"#14"},
{c:"Story",q:"Case 15 — Tell me about saving a customer money.",a:["SAT: 70 licences × 1,000 minutes, using twice that.","Held the overage that month; reviewed the implementation.","Cause: session started in the queue, minutes running (\"answer the call, then wait 30 minutes\").","Fix: start when the agent accepts → usage −25%.","Rest: a discount cheaper than more licences. Warned them about April."],r:"#15",b:"\"Same class as replay with no minimum duration.\""},
{c:"Story",q:"Case 16 — Tell me about an account you saved.",a:["A mid-sized credit union said they wouldn't renew: they'd removed chat.","I asked for a session instead of accepting it.","Their customers still called with the same website problems.","Showed the phone flow (4-digit PIN), implemented it, trained the agents.","They renewed. Customers churn when the way they used it changes."],r:"#16"},
{c:"Story",q:"Case 17 — Your champion left. What happened?",a:["CubeSmart: the buyer left; the new manager found me and wanted more stores.","Re-onboarded them: history, flows, usage, data, billing.","Pointed them to an internal coach; shortcuts reusing the first store's setup.","Grew to more stores, modestly. The risk was losing it.","Retro: today I'd map a second contact from day 1."],r:"#17"},
{c:"Story",q:"Case 18 — A customer didn't trust your numbers. What did you do?",a:["\"We didn't use this many licences\": they compared NICE agents with Surfly users.","Showed the usage history in the dashboard, user by user.","Root cause: 2 systems, no offboarding sync.","BRD clause, training, utilisation alert; no SCIM, so offboarding checklist + our API for some.","Find the 2 numbers, explain the gap, fix the implementation."],r:"#18"},
{c:"Story",q:"Case 19 — Build vs buy: why not build it ourselves?",a:["I had GA4 + Stape/GTM + Sheets + Supabase → then built my own server (~5,000 lines).","Ingestion, Meta CAPI, GA4, webhooks, encrypted secrets, a ROAS dashboard.","Lesson: the subscription (~$20/month) wasn't the cost, the hours were.","PostHog: proxy, cookieless, destinations, dashboards, from 1 place; free at my volume."],r:"#19",b:"Their \"internal build\" churn reason, from the inside."},
// ---------- Logistics ----------
{c:"Logistics",q:"What was your net revenue retention?",a:["\"Between 101 and 108%, depending on the 12-month window.\"","Best line: \"Our oldest cohort, from 2023, is at 102.5% after 3 years.\"","Never \"108%\" alone. Don't try to match their 110%."]},
{c:"Logistics",q:"Right to work?",a:["No sponsorship needed.","Residence permit valid until 2028; citizenship application in its final stage.","Not \"I got my citizenship\"."]},
{c:"Logistics",q:"Notice period and salary?",a:["Notice: 30 days contractually, with vacation to use → available in about 2 to 3 weeks.","Salary: consistent with what you told Rune (€90–95k), checked against their calculator."]},
{c:"Logistics",q:"Your questions for Dana?",a:["How is the account-transition ruleset taking shape, and what surprises are most common when an account lands with a CSM?","Which leading indicators do you trust more than the health score?","What separates TCSMs who hit 110% NRR from those who don't?","Before the last 10 minutes: \"What would you need to see from someone in this role to feel confident you'd made the right hire?\""]}
];
const K='ph-dana-fc-v2';
let st={};try{st=JSON.parse(localStorage.getItem(K)||'{}')}catch(e){st={}}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(st))}catch(e){}};
C.forEach((x,i)=>x.id=i);
const cats=["All",...new Set(C.map(x=>x.c))];
let cat="All",onlyAgain=false,list=false,order=C.map(x=>x.id),pos=0;
const $=s=>document.querySelector(s);
const esc=s=>s.replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
function deck(){return order.map(i=>C[i]).filter(x=>(cat==="All"||x.c===cat)&&(!onlyAgain||st[x.id]==="n"))}
function chips(){$('#chips').innerHTML=cats.map(c=>`<button class="chip${c===cat?' on':''}" data-c="${c}">${c}</button>`).join('');}
function back(x){return `<ol>${x.a.map(b=>`<li>${esc(b)}</li>`).join('')}</ol>`+(x.r?`<div class="ref">Story: <b>${esc(x.r)}</b></div>`:'')+(x.b?`<div class="bridge">${esc(x.b)}</div>`:'')}
function render(){
  const d=deck(),known=d.filter(x=>st[x.id]==="y").length;
  $('#count').textContent=`${d.length} cards · ${known} got it`;
  $('#pbar').style.width=d.length?(known/d.length*100)+'%':'0';
  $('#onlyAgain').textContent=onlyAgain?'Show all':'Only "again"';
  $('#mode').textContent=list?'🃏 Card view':'📋 List view';
  if(!d.length){$('#view').innerHTML='<div class="done">No cards here. 🎉</div>';return}
  if(list){$('#view').innerHTML='<div class="list">'+d.map(x=>`<div class="item"><span class="cat">${x.c}</span>${st[x.id]==="y"?'<span class="k y">got it</span>':st[x.id]==="n"?'<span class="k n">again</span>':''}<div class="q">${esc(x.q)}</div><details><summary>Beats</summary>${back(x)}</details></div>`).join('')+'</div>';return}
  if(pos>=d.length)pos=0;
  const x=d[pos];
  $('#view').innerHTML=`<div class="card" id="card"><div class="cat">${x.c} · ${pos+1}/${d.length}${st[x.id]==="y"?' · ✓':st[x.id]==="n"?' · ↻':''}</div><div class="q">${esc(x.q)}</div><div class="hint">Answer out loud, then tap to reveal.</div><div class="ans">${back(x)}</div></div>
  <div class="acts"><button class="again" id="again">↻ Again</button><button class="got" id="got">✓ Got it</button></div>
  <div class="nav"><button id="prev">← Prev</button><button id="next">Next →</button></div>`;
  $('#card').onclick=()=>$('#card').classList.toggle('open');
  const mark=v=>{st[x.id]=v;save();pos=onlyAgain&&v==="y"?pos:pos+1;render()};
  $('#again').onclick=()=>mark("n");$('#got').onclick=()=>mark("y");
  $('#prev').onclick=()=>{pos=(pos-1+d.length)%d.length;render()};
  $('#next').onclick=()=>{pos=(pos+1)%d.length;render()};
}
$('#chips').onclick=e=>{if(e.target.dataset.c){cat=e.target.dataset.c;pos=0;chips();render()}};
$('#shuffle').onclick=()=>{for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}pos=0;render()};
$('#onlyAgain').onclick=()=>{onlyAgain=!onlyAgain;pos=0;render()};
$('#mode').onclick=()=>{list=!list;render()};
$('#reset').onclick=()=>{if(confirm('Reset all progress?')){st={};save();pos=0;render()}};
document.addEventListener('keydown',e=>{if(list)return;const c=$('#card');if(!c)return;if(e.key===' '){e.preventDefault();c.classList.toggle('open')}else if(e.key==='ArrowRight')$('#next').click();else if(e.key==='ArrowLeft')$('#prev').click();else if(e.key==='1')$('#again').click();else if(e.key==='2')$('#got').click()});
chips();render();
</script>
</body>
</html>
